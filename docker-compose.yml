version: '3.8'

services:
  nudge:
    image: ghcr.io/leo-cmp/nudge:latest
    container_name: nudge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=${PORT:-8080}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DEFAULT_CHAT_ID=${TELEGRAM_DEFAULT_CHAT_ID}
      - DATABASE_URL=/data/nudge.db
    volumes:
      - nudge-data:/data
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nudge.rule=Host(`nudge.exemplo.com`)"
      - "traefik.http.routers.nudge.entrypoints=websecure"
      - "traefik.http.routers.nudge.tls=true"
      - "traefik.http.routers.nudge.tls.certresolver=myresolver"
      - "traefik.http.services.nudge.loadbalancer.server.port=8080"
      - "traefik.docker.network=traefik-public"

volumes:
  nudge-data:

networks:
  traefik-public:
    external: true
