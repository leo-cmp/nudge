name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: nudge-linux-amd64
          - goos: linux
            goarch: arm64
            asset_name: nudge-linux-arm64
          - goos: darwin
            goarch: amd64
            asset_name: nudge-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset_name: nudge-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-w -s" -o ${{ matrix.asset_name }} ./cmd/nudge

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
