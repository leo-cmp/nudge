name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binaries
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-w -s" -o nudge-linux-amd64   ./cmd/nudge
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-w -s" -o nudge-linux-arm64   ./cmd/nudge
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-w -s" -o nudge-darwin-amd64  ./cmd/nudge
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-w -s" -o nudge-darwin-arm64  ./cmd/nudge

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nudge-linux-amd64
            nudge-linux-arm64
            nudge-darwin-amd64
            nudge-darwin-arm64
